<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>DisplayFlip mockup 04-dialog-simpan</title>
<!-- DisplayFlip mockup 04: Dialog Simpan layout. Frame 560x340 px pada skala 100%.
     Referensi ukuran, spasi, dan struktur. Data contoh, latar desktop/taskbar,
     dan warna peraga BUKAN spesifikasi.
     Sumber kebenaran: docs/displayflip-windows11-mockup.md.
     Butuh Windows 11 (font Segoe UI Variable dan Segoe Fluent Icons). -->
<style>
body{margin:0}
.r{position:relative;overflow:hidden;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;font-size:12px;line-height:16px}
.i{font-family:'Segoe Fluent Icons','Segoe MDL2 Assets';font-size:16px;width:16px;text-align:center;flex:none}
.b{height:32px;border:1px solid #E5E5E5;border-radius:4px;background:#FBFBFB;color:#1B1B1B;font:inherit}
</style>
</head>
<body>
<div class="r" style="width:560px;height:340px;background:#A9ABAE;display:flex;align-items:center;justify-content:center">
<div style="width:420px;border-radius:8px;overflow:hidden;background:#F9F9F9;box-shadow:0 8px 24px rgba(0,0,0,.3);color:#1B1B1B">
<div style="padding:24px"><div style="font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;font-size:20px;line-height:28px;font-weight:600">Simpan layout sekarang</div>
<label for="nama" style="display:block;margin-top:16px;color:#6B6B6B">Nama profil</label>
<input id="nama" value="Primary Kanan" style="box-sizing:border-box;width:100%;height:32px;margin-top:4px;padding:0 10px;border:1px solid rgba(0,0,0,.1);border-bottom:2px solid #0067B8;border-radius:4px;background:#fff;font:inherit;color:#1B1B1B">
<div style="margin-top:12px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:4px;background:#FFF4CE"><span class="i" style="color:#9D5D00" aria-hidden="true">&#xE7BA;</span><span>Nama sudah ada — akan ditimpa</span><button class="b" style="margin-left:auto;height:28px;padding:0 12px">Timpa</button></div>
</div>
<div style="display:flex;gap:8px;padding:24px;background:#F3F3F3"><button class="b" style="flex:1">Batal</button><button style="flex:1;height:32px;border:0;border-radius:4px;background:#0067B8;color:#fff;font:inherit">Simpan</button></div>
</div>
</div>
</body>
</html>
