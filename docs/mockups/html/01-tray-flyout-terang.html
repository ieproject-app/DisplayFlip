<!doctype html>

<title>DisplayFlip mockup 01-tray-flyout-terang</title>
<!-- DisplayFlip mockup 01: Tray flyout, taskbar terang. Frame 640x440 px pada skala 100%.
     Referensi ukuran, spasi, dan struktur. Data contoh, latar desktop/taskbar,
     dan warna peraga BUKAN spesifikasi.
     Sumber kebenaran: docs/displayflip-windows11-mockup.md.
     Butuh Windows 11 (font Segoe UI Variable dan Segoe Fluent Icons). -->
<style>
body{margin:0}
.r{position:relative;overflow:hidden;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;font-size:12px;line-height:16px}
.i{font-family:'Segoe Fluent Icons','Segoe MDL2 Assets';font-size:16px;width:16px;text-align:center;flex:none}
.it{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px;border-radius:4px}
.h{background:rgba(255,255,255,.7)}
.s{height:1px;background:rgba(0,0,0,.09);margin:4px 2px}
</style>
</head>
<body>
<div class="r" style="width:640px;height:440px;background:#C8D3DF">
<div style="position:absolute;right:16px;bottom:56px;width:240px;box-sizing:border-box;padding:6px;border-radius:8px;background:rgba(243,243,243,.9);backdrop-filter:blur(24px);box-shadow:0 8px 24px rgba(0,0,0,.28);color:#1B1B1B">
<div class="it h"><span class="i" aria-hidden="true">&#xE8AB;</span>Tukar kiri-kanan<span style="margin-left:auto;font-size:11px;line-height:14px;color:#6B6B6B">Ctrl+Shift+M</span></div>
<div class="s"></div>
<div class="it"><span class="i" aria-hidden="true">&#xE7F4;</span>Jadikan primary<span class="i" style="margin-left:auto;font-size:12px;color:#6B6B6B" aria-hidden="true">&#xE76C;</span></div>
<div class="it"><span class="i" aria-hidden="true">&#xE74E;</span>Simpan layout sekarang</div>
<div class="it"><span class="i" aria-hidden="true">&#xE768;</span>Terapkan profil<span class="i" style="margin-left:auto;font-size:12px;color:#6B6B6B" aria-hidden="true">&#xE76C;</span></div>
<div class="s"></div>
<div class="it"><span style="width:16px;height:16px;border-radius:4px;background:#0067B8;color:#fff;display:flex;align-items:center;justify-content:center;flex:none"><span class="i" style="font-size:10px;width:auto" aria-hidden="true">&#xE73E;</span></span>Jalan otomatis saat Windows start</div>
<div class="it"><span class="i" aria-hidden="true">&#xE8BB;</span>Keluar</div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:48px;background:#EEEEEE;box-shadow:0 -1px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:12px;color:#1B1B1B">
<span class="i" style="width:32px;line-height:32px;font-size:12px" aria-hidden="true">&#xE70E;</span>
<span style="width:32px;height:32px;border-radius:4px;background:rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x=".5" y=".5" width="15" height="15" rx="4" fill="#24292E" stroke="#E6E8EB"/><rect x="3" y="3.5" width="4" height="5" rx=".7" fill="#fff"/><rect x="9" y="3.5" width="4" height="5" rx=".7" fill="#fff"/><path d="M4 12h8m-2-1.6l2 1.6-2 1.6" fill="none" stroke="#F2B134" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span style="text-align:right;font-size:11px;line-height:14px;padding:0 8px">14.20<br/>13/11/2026</span>

</div>
